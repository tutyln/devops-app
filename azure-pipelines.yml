trigger:
  - main
  - feature/add-task

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: 'Select Python version'

  - script: python -m unittest -v
    displayName: 'Run Python tests'

  - script: docker build -t mini-tasks:$(Build.BuildId) .
    displayName: 'Build Docker image'

  - script: |
      echo "Otomatik pipeline testi"
      test -f README.md
    displayName: 'Build ve dosya kontrolü'