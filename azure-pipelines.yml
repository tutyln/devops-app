trigger:
  - main
  - feature/add-task

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.x'
    displayName: 'Select Python version'

  - script: |
      python -m pip install -r requirements.txt
      python -m unittest -v
    displayName: 'Install dependencies and run tests'

  - script: docker build -t mini-tasks:$(Build.BuildId) .
    displayName: 'Build Docker image'

  - script: |
      docker build -t tttaylor/mini-tasks:$(Build.BuildId) .
    displayName: 'Prepare Docker Hub image'
