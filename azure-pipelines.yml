trigger:
  - main
  - feature/add-task

pool:
  name: Default
  demands:
    - Agent.Name -equals Windows-CD-Agent

steps:
  - script: |
      python --version
      python -m pip --version
    displayName: 'Check Python installation'

  - script: |
      python -m pip install -r requirements.txt
      python -m unittest -v
    displayName: 'Install dependencies and run tests'

  - task: Docker@2
    displayName: 'Build and push Docker image'
    inputs:
      command: buildAndPush
      containerRegistry: dockerhubconn
      repository: tttaylor/mini-tasks
      Dockerfile: '**/Dockerfile'
      tags: |
        $(Build.BuildId)
        latest