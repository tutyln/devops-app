trigger:
  - main
  - feature/add-task

pool:
  name: Default
  demands:
    - Agent.Name -equals Windows-CD-Agent

steps:
  - script: |
      python --version
      python -m pip --version
    displayName: 'Check Python installation'

  - script: |
      python -m pip install -r requirements.txt
      python -m unittest -v
    displayName: 'Install dependencies and run tests'

  - task: Docker@2
    displayName: 'Build and push Docker image'
    inputs:
      command: buildAndPush
      containerRegistry: dockerhubconn
      repository: tttaylor/mini-tasks
      Dockerfile: '**/Dockerfile'
      tags: |
        $(Build.BuildId)
        latest

  - powershell: |
      docker pull tttaylor/mini-tasks:latest
      if ($LASTEXITCODE -ne 0) { exit 1 }

      docker rm -f mini-tasks-web 2>$null
      docker run -d --restart unless-stopped --name mini-tasks-web -p 5000:5000 tttaylor/mini-tasks:latest
      if ($LASTEXITCODE -ne 0) { exit 1 }

      docker ps
    displayName: 'Deploy updated container'