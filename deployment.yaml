apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-app-deployment
  labels:
    app: multi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-app
  template:
    metadata:
      labels:
        app: multi-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/tutyln/devops-app:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
